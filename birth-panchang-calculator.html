        tr("Tamil yoga", TAMIL[tb] + (tsp.length ? ", with " + tsp.join(" and ") + " yoga" : "") + "<br><small>from " + DAYS[vara] + " and " + NAK[na.k] + "</small>"),
        tr("Puṣkara yoga", (push === 2 ? "Dvipuṣkara yoga" : push === 3 ? "Tripuṣkara yoga" : "None") + "<br><small>needs a Sunday, Tuesday or Saturday, a Bhadrā tithi and a nakṣatra split between two signs</small>"),
        tr("Āḍal and Vidāl", (adalY ? adalY + " yoga" : "Neither") + "<br><small>" + NAK[na.k] + " is the " + ord(adal) + " from the Sun’s nakṣatra, " + NAK[sunNak] + ", counting Abhijit</small>"),
        tr("Kāraka tithi", tithiName(kt) + "<br><small>the tithi of " + nm(AMK) + ", your amātyakāraka, from " + nm(AK) + ", your ātmakāraka</small>"),
        tr("Kāraka yoga", YOGA[ky] + "<br><small>the yoga of the same two grahas</small>"),
        tr("Śiva vāsa", "Śiva is " + SHIVA[shiva]),
        tr("Agni vāsa", "Agni is " + AGNI[agni]),
        tr("Yoginī vāsa", "The yoginī is in the " + DIR[yogini]),
        tr("Diśā śūla", "Towards the " + DIR[SHOOL[vara]] + "<br><small>the direction not to travel in on a " + DAYS[vara] + "</small>"),
        tr("Chandrāṣṭama", "For " + S[(ra.k + 5) % 12] + " natives<br><small>the Moon is in the 8th from " + S[(ra.k + 5) % 12] + "</small>"),
        tr("Pañca pakṣī", bird + "<br><small>your bird, from " + NAK[na.k] + " in the " + (sukla ? "bright" : "dark") + " fortnight</small>")
      ]);

      h += "<h3>Calendar</h3>" + table([
        tr("Lunar month", (adhika ? "Adhika " : nija ? "Nija " : "") + MONTH[mi] + " (amānta)<br><small>" + (pmi !== mi ? MONTH[pmi] + " in the pūrṇimānta reckoning, " : "the same in the pūrṇimānta reckoning, ") + "from the new moon of " + TA.dayLabel(N0, w) + " to that of " + TA.dayLabel(N1, w) + "</small>"),
        tr("Ṛtu", RTU[Math.floor(mi / 2)]),
        tr("Saṁvatsara", YEAR[sam] + "<br><small>the lunar year from Chaitra" + (ssam !== sam ? "; the solar year from Meṣa saṅkrānti is still " + YEAR[ssam] : "") + "</small>"),
        tr("Śaka and Vikrama", "Śaka " + (Ych - 78) + ", Vikrama " + (Ych + 57) + "<br><small>Vikrama " + (Ych + 57 - (mi < 7 ? 1 : 0)) + " counted from Kārttika, as in Gujarat</small>"),
        tr("Kali yuga", "Year " + (Ych + 3101) + ", day " + (civil(sr0) + 1852122) + "<br><small>the ahargaṇa, days since the start of the Kali yuga</small>"),
        tr("Sahasra candrodaya", TA.dayLabel(F1000, w) + " at " + clk(F1000, 0, 1) + "<br><small>your thousandth full moon, local time</small>")
      ]);

      h += '<details><summary>The twelve special tithis</summary>' + table(spt.map(function (k, i) { return "<tr><th scope=\"row\">" + HOUSE[i] + " tithi</th><td>" + tithiName(k) + "</td><td>" + (i + 1) + " × (Moon − Sun)</td></tr>"; }), ["Tithi", "At your birth", "From"]) + "</details>";
      h += '<details><summary>The 30 muhūrtas of the day</summary>' + table(mu.map(function (p, i) { return "<tr" + (i === mk ? ' class="ta-now"' : "") + "><td>" + (i < 15 ? "Day " : "Night ") + (i % 15 + 1) + "</td><td>" + MUH[i] + "</td><td>" + span(p[0], p[1]) + "</td><td>" + (MUHG.charAt(i) === "1" ? "auspicious" : "inauspicious") + "</td></tr>"; }), ["", "Muhūrta", "Time", "Nature"]) + "</details>";
      h += '<details><summary>The 16 choghadiyas</summary>' + table(cg.map(function (p, i) { return "<tr" + (i === ck ? ' class="ta-now"' : "") + "><td>" + (i < 8 ? "Day " : "Night ") + (i % 8 + 1) + "</td><td>" + CHOG[p[2]] + "</td><td>" + span(p[0], p[1]) + "</td><td>" + (CHOGG.charAt(p[2]) === "1" ? "good" : "bad") + "</td></tr>"; }), ["", "Choghadiya", "Time", "Nature"]) + "</details>";
      h += '<details><summary>The 24 horās</summary>' + table(hr.map(function (p, i) { return "<tr" + (i === hk ? ' class="ta-now"' : "") + "><td>" + (i + 1) + "</td><td>" + tn(p[2]) + "</td><td>" + span(p[0], p[1]) + "</td></tr>"; }), ["", "Lord", "Time"]) + "</details>";
      h += '<p class="ta-tool-note">' + TA.esc(w.name) + ", " + birthDay + ", " + TA.clock(u, w, r.sec) + " local time (" + TA.utcLabel(u, w) + "). Sunrise and sunset are for the centre of the Sun on the true horizon, without refraction, which is the Hindu reckoning; almanacs that use the upper edge give times a few minutes different. True Citrapakṣa ayanāṁśa, " + (r.node === "mean" ? "mean" : "true") + " node for the kārakas.</p>";
      out.innerHTML = h;
    } catch (e) { out.innerHTML = '<p class="ta-tool-err">' + TA.esc(e.message) + "</p>"; }
  });
})();
//--></script>
</body>
</html>
